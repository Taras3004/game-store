<div class="flex flex-col gap-1 cursor-pointer group" (click)="onClick()">
    <div class="aspect-square bg-slate-800 w-full mb-2 relative overflow-hidden">
        <!-- <img [src]="game.imageUrl" class="object-cover w-full h-full group-hover:scale-105 transition-transform duration-300"> -->
    </div>

    <h3
        class="font-bold text-slate-800 text-sm leading-tight group-hover:text-orange-500 transition-colors line-clamp-2"
    >
        {{ game.title }}
    </h3>

    <span class="text-xs text-slate-500">{{ game.platform }}</span>

    @if (game.discountedPrice) {
        <div class="mt-1">
            <span class="text-sm font-bold text-red-700 pr-1">{{
                game.discountedPrice | currency: "USD"
            }}</span>
            <span class="text-xs font-bold text-slate-500 line-through">{{
                game.price | currency: "USD"
            }}</span>
        </div>
    } @else {
        <span class="text-sm font-bold text-slate-800 mt-1">{{
            game.price | currency: "USD"
        }}</span>
    }
</div>
