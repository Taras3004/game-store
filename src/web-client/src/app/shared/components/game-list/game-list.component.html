<div class="flex flex-col w-full">
    <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-x-6 gap-y-10">
        @for (game of games; track game.id) {
            <game-list-item [game]="game" (selectGame)="onGameSelect($event)"> </game-list-item>
        }
    </div>

    <div class="flex justify-center items-center gap-4 mt-16 text-slate-400 text-sm">
        <button class="hover:text-orange-500 transition-colors">&lt;</button>
        <button class="text-orange-500 font-bold border-b-2 border-orange-500 pb-1">1</button>
        <button class="hover:text-orange-500 transition-colors pb-1">2</button>
        <button class="hover:text-orange-500 transition-colors pb-1">3</button>
        <span class="pb-1">...</span>
        <button class="hover:text-orange-500 transition-colors pb-1">12</button>
        <button class="hover:text-orange-500 transition-colors">&gt;</button>
    </div>
</div>
