<div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
    <div class="lg:col-span-2">
        <div class="flex justify-between mb-4">
            <h1 class="font-bold text-2xl">Cart</h1>

            <span>3 items</span>
        </div>
        <hr class="text-gray-300 mb-4" />

        <cart-item-list
            [items]="cartItems"
            (itemRemoved)="removeItem($event)"
            (quantityIncreased)="increaseQuantity($event)"
            (quantityDecreased)="decreaseQuantity($event)"
        >
        </cart-item-list>
    </div>
    <div class="bg-gray-50 p-6 self-start lg:mt-12">
        <h2 class="font-bold text-lg text-slate-800 mb-6">Order Summary</h2>

        <div class="flex flex-col gap-4 text-sm text-slate-600 border-b border-gray-200 pb-6 mb-6">
            <div class="flex justify-between">
                <span>Subtotal</span>
                <span>{{ subtotal | currency: "USD" }}</span>
            </div>
            <div class="flex justify-between">
                <span>Taxes</span>
                <span>{{ taxes | currency: "USD" }}</span>
            </div>
        </div>

        <div class="flex justify-between items-center mb-8">
            <span class="font-bold text-lg text-slate-800">Total</span>
            <span class="font-bold text-orange-500 text-lg">{{ total | currency: "USD" }}</span>
        </div>

        <button
            class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 transition-colors"
        >
            Checkout
        </button>
    </div>
</div>
