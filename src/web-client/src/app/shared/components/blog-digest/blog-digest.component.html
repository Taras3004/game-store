<div class="p-6 bg-gray-50 flex flex-col h-full">
    <h2 class="text-2xl font-bold text-slate-800 mb-6">From the Blog</h2>

    <div class="flex flex-col">
        @for (post of posts; track post.id) {
            <div class="py-4 border-b border-gray-200 last:border-0 first:pt-0">
                <p class="text-slate-600 text-sm inline">
                    {{ post.text }}
                </p>
                <a [href]="post.link" class="text-orange-500 text-sm hover:underline ml-1">Learn more</a>
            </div>
        }
    </div>

    <button class="mt-auto self-end bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-6 transition-colors">
        Visit Blog
    </button>
</div>
