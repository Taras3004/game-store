<div class="p-6 bg-gray-50">
    <h2 class="text-2xl font-bold text-slate-800 mb-6">Get In Touch</h2>
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        
        <div class="flex flex-col gap-1">
            <label for="name" class="text-sm text-slate-600">Name</label>
            <input type="text" id="name" formControlName="name" 
                   class="w-full p-2 border border-gray-300 bg-white focus:outline-none focus:border-orange-500 transition-colors">
        </div>

        <div class="flex flex-col gap-1">
            <label for="email" class="text-sm text-slate-600">Email</label>
            <input type="email" id="email" formControlName="email" 
                   class="w-full p-2 border border-gray-300 bg-white focus:outline-none focus:border-orange-500 transition-colors">
        </div>

        <div class="flex flex-col gap-1">
            <label for="message" class="text-sm text-slate-600">Message</label>
            <textarea id="message" name="message" formControlName="message" rows="4"
                      class="w-full p-2 border border-gray-300 bg-white resize-none focus:outline-none focus:border-orange-500 transition-colors"></textarea>
        </div>

        @if(error){
            <span class="text-red-500 text-sm font-semibold">{{ error }}</span>
        }

        <button type="submit" 
                class="self-end bg-orange-500 hover:bg-orange-600 text-white font-bold py-2 px-8 transition-colors">
            Submit
        </button>
        
    </form>
</div>
